approval_policy = "never"
sandbox_mode = "danger-full-access"

[agents]
enabled = true
max_depth = 2
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[features.multi_agent_v2]
hide_spawn_agent_metadata = false

[agents.orchestrator]
description = "Goal-loop orchestrator. Manages plan → build → verify → review → QA until harness DONE."
config_file = "./agents/orchestrator.toml"

[agents.planner]
description = "Architecture and implementation plans. Emits route, research, and risk signals."
config_file = "./agents/planner.toml"

[agents.researcher]
description = "On-demand research for unfamiliar tech, docs, APIs, performance, and security."
config_file = "./agents/researcher.toml"

[agents.builder]
description = "Routine frontend/backend execution (CRUD, UI, refactors, config, tests)."
config_file = "./agents/builder.toml"

[agents.builder-expert]
description = "Escalation-only complex execution (algorithms, concurrency, security, performance)."
config_file = "./agents/builder-expert.toml"

[agents.reviewer]
description = "Code review for correctness, security, performance, and tests."
config_file = "./agents/reviewer.toml"

[agents.qa]
description = "Behavior/business QA against acceptance criteria (conditional)."
config_file = "./agents/qa.toml"

[agents.visual-reviewer]
description = "Multimodal UI/visual review for layout, contrast, accessibility, and screenshots."
config_file = "./agents/visual-reviewer.toml"

